<!doctype html>

<head><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400&display=swap"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components/bundle.css"><script src="../../vendor/react.production.min.js"></script><script src="../../vendor/react-dom.production.min.js"></script><script src="../../components/bundle.js"></script><meta charset="utf-8"><title>Nusuk Design Language — cover</title>
<style>
html,body{margin:0}
body{background:var(--surface-screen-bk);width:960px;height:288px;position:relative;overflow:hidden;font-family:var(--font-sans)}
svg{position:absolute;top:0;left:0}
.ink{fill:var(--surface-10-ink)}
.gold{fill:var(--brand-quranic-illumination)}
.green{fill:var(--brand-dome-of-prophet)}
.tint{fill:var(--surface-shade-4)}
.arch{fill:var(--surface-illumination)}
.blk{rx:var(--radius-md);ry:var(--radius-md)}
.name{position:absolute;left:48px;top:150px;margin:0;font-size:64px;line-height:.95;font-weight:300;color:var(--text-heading);max-width:864px;letter-spacing:0}
.tag{position:absolute;left:48px;top:228px;margin:0;font-size:14px;line-height:1.28;color:var(--text-note);max-width:440px}

<body>
<!--
blocks: surface-10-ink 432×130 (slab, bleeds off top) · brand-quranic-illumination 208×130 · brand-dome-of-prophet 80×130 · surface-shade-4 190×130; corners radius-md, gaps space-nr (18)
arrangement: one top band, a wide Ink slab with three satellites of falling width, all bleeding off the top edge like awnings over the Haram courtyard
pattern: literal motif, an arcade of seven arches (half-rounds of radius-md) in surface-illumination along the slab's foot; chosen because Nusuk's motif is the sacred architecture of the two Holy Mosques, and the accent follows the theme
scales: arch width 2×radius-md (36), arch pitch 36 + space-nr (54), band height 112, name 64px Light, tagline 14px text-note
-->
